name: Shark Continuous Research

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shark-continuous-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Deterministic tests
        run: python -m pytest -q

      - name: Run research agents
        run: python -m shark.agents.daily

      - name: Validate research report
        run: |
          test -s reports/daily-agent-report.json
          python -m json.tool reports/daily-agent-report.json > /dev/null

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shark-daily-research-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
