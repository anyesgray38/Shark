name: Shark Continuous Research

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shark-continuous-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated Python environment
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install
        run: |
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m pip install pytest

      - name: Deterministic tests
        run: .venv/bin/python -m pytest -q

      - name: Run research agents
        run: .venv/bin/python -m shark.agents.daily

      - name: Validate research report
        run: |
          test -s reports/daily-agent-report.json
          .venv/bin/python -m json.tool reports/daily-agent-report.json > /dev/null

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shark-daily-research-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
