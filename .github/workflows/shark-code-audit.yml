name: Shark Code Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shark-code-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .
          python3 -m pip install pytest ruff

      - name: Compile check
        run: python3 -m compileall -q shark tests

      - name: Tests before lint normalization
        run: python3 -m pytest -q

      - name: Ruff autofix
        run: python3 -m ruff check . --fix

      - name: Ruff audit
        run: python3 -m ruff check .

      - name: Capture Ruff normalization patch
        if: always()
        run: git diff -- . ':(exclude)ruff-autofix.patch' > ruff-autofix.patch

      - name: Upload Ruff normalization patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shark-ruff-autofix-${{ github.run_id }}
          path: ruff-autofix.patch
          if-no-files-found: error
          retention-days: 14
